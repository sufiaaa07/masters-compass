<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Dishlog</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6ec;--ink:#1a1612;--mut:#7a7164;--line:#e8dfcf;--card:#fff;--red:#e8452c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--ink:#fbf6ec;--mut:#a89f92;--line:#3a332b;--card:#241e18}}
:root[data-theme="dark"]{--bg:#17130f;--ink:#fbf6ec;--mut:#a89f92;--line:#3a332b;--card:#241e18}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 "DM Sans",system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:430px;padding:20px 18px 130px;min-height:100vh}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;margin:0;letter-spacing:-.02em}
h1{font-size:32px;line-height:1.05}h2{font-size:22px;margin:26px 0 10px}h3{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.mut{color:var(--mut);font-size:14px}.st{font:500 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:var(--mut)}
.pill{border:1.5px solid var(--ink);background:none;border-radius:99px;padding:8px 16px;font-weight:600}
.pill.on,.pill.pri{background:var(--ink);color:var(--bg)}.pill.red{background:var(--red);border-color:var(--red);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -18px;padding:0 18px;scrollbar-width:none}.chips .pill{flex:none;padding:6px 14px;font-size:14px}
.av{width:44px;height:44px;border-radius:50%;border:0;background:var(--red);color:#fff;font:800 18px "Bricolage Grotesque";flex:none}
.srch{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:14px 16px;color:var(--mut);margin-top:6px}
.cat{flex:none;text-align:center;background:none;border:0;font-size:13px;font-weight:500}.cat b{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:28px;font-weight:400;margin-bottom:4px}
.hero{display:block;width:calc(100% + 36px);margin:0 -18px;border:0;background:none;text-align:left;padding:0}
.hero img,.hero .ph{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.hero .m{padding:10px 18px 0}.hero h3{font-size:24px}
img,.ph{background:#e9d9bd}.ph{display:grid;place-items:center;font-size:44px;background:linear-gradient(135deg,#f4d9b8,#f0b9a0)}
.rail{display:flex;gap:12px;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scroll-snap-type:x proximity;scrollbar-width:none}
.mini{flex:none;width:150px;scroll-snap-align:start;border:0;background:none;text-align:left;padding:0}.mini img,.mini .ph{width:150px;height:150px;border-radius:14px;object-fit:cover;display:grid;font-size:36px}.mini b{display:block;margin-top:6px;font-size:15px}
.want{flex:none;width:210px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.want .pill{margin-top:10px;font-size:13px;padding:6px 12px}
.sticker{display:inline-block;background:var(--red);color:#fff;font-weight:600;font-size:13px;padding:3px 12px;border-radius:99px;transform:rotate(-3deg)}
.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:dense;gap:8px;margin-top:6px}
.tile{position:relative;overflow:hidden;border:0;padding:0;border-radius:12px;background:#e9d9bd;min-height:0}.tile img,.tile .ph{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:0}
.t0{grid-column:span 2;aspect-ratio:4/3}.t1{aspect-ratio:3/4}.t2{aspect-ratio:1}.t3{aspect-ratio:3/4;margin-top:-30px}.t4{aspect-ratio:1}
.cap{position:absolute;left:0;right:0;bottom:0;padding:28px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;text-align:left}.cap b{display:block;font:800 15px "Bricolage Grotesque"}.cap small{font-size:11px;opacity:.9}
.line{margin:6px 0 0 6px;padding:0 0 0 18px;border-left:2px dashed var(--line)}.stop{position:relative;padding-bottom:26px}.stop:before{content:"";position:absolute;left:-25px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--red)}
.car{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;margin:8px 0}.car img{height:230px;border-radius:12px;scroll-snap-align:start;flex:none;max-width:100%}
.quote{font-style:italic;margin:6px 0}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:13px;margin:0 4px 4px 0}
.item{display:flex;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0}.item img,.item .ph{width:60px;height:60px;border-radius:10px;flex:none;object-fit:cover;font-size:26px}
.empty{text-align:center;padding:36px 12px}.empty h2{margin-top:0}.empty p{color:var(--mut)}
.sticky{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;padding:0 18px;pointer-events:none}.sticky button{pointer-events:auto;width:100%;max-width:394px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:3}
nav div{display:flex;width:100%;max-width:430px;align-items:center}nav button{flex:1;background:none;border:0;min-height:56px;font-size:11px;font-weight:500;color:var(--mut)}nav button b{display:block;font-size:20px;font-weight:400}nav button.on{color:var(--ink);font-weight:600}
nav .plus{flex:none;width:58px;height:58px;margin:-18px 10px 0;border-radius:50%;background:var(--red);color:#fff;font-size:34px;line-height:1;box-shadow:0 4px 14px rgba(232,69,44,.45)}
#sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:6;display:flex;justify-content:center}#sheet[hidden]{display:none}#sheet>div{width:100%;max-width:430px;padding:18px 18px 0}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 4px}
input,select,textarea{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px}
.vh{position:absolute;opacity:0;width:1px;height:1px}.pb{display:flex;gap:10px}.pb label{flex:1;margin:0;text-align:center;border:1.5px dashed var(--ink);border-radius:16px;padding:18px 6px;font-weight:600;cursor:pointer}.pb label:focus-within{outline:3px solid #2563eb}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin:10px 0}.thumbs img{width:80px;height:80px;object-fit:cover;border-radius:10px;display:block}.thumbs div{flex:none;text-align:center}
.link{background:none;border:0;text-decoration:underline;font-size:13px;padding:4px;color:inherit}
.rxs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rxs label{margin:0;text-align:center;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:14px 4px;font-size:13px;cursor:pointer}.rxs span{display:block;font-size:30px}.rxs label:has(:checked){border-color:var(--red);background:var(--red);color:#fff;transform:scale(1.04)}.rxs input{position:absolute;opacity:0;width:1px;height:1px}.rxs label:has(:focus-visible){outline:3px solid #2563eb}
.ban{background:#fdebd0;color:#3a2a10;border-radius:14px;padding:12px;margin-top:12px}.ban .pill{margin:8px 6px 0 0;font-size:13px;padding:5px 12px;color:#1a1612;border-color:#1a1612}
.save{position:sticky;bottom:0;padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 25%)}.big{width:100%;background:var(--red);color:#fff;border:0;border-radius:99px;padding:17px;font-weight:600;font-size:18px}.big:disabled{opacity:.5}.big.dk{background:var(--ink);color:var(--bg)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;z-index:9;font-size:14px;font-weight:500;white-space:nowrap;max-width:92%}#toast[hidden]{display:none}.err{color:#c2410c;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
@media(prefers-reduced-motion:no-preference){#app>*{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style></head><body>
<main id="app"></main><nav aria-label="Main"><div id="nav"></div></nav><div id="sheet" hidden></div><div id="toast" role="status" hidden></div>
<script>
const $=s=>document.querySelector(s),e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,9),today=()=>new Date().toISOString().slice(0,10);
const EM={Pasta:'🍝',Burger:'🍔',Biryani:'🍛',Dessert:'🍰',Pizza:'🍕',Coffee:'☕',Ramen:'🍜',Asian:'🥟'},em=c=>EM[c]||'🍽',RXL={'Obsessed':'😍 Obsessed','It’s good':'🙂 Good','Skip next time':'😐 Skip next time'},rxl=x=>RXL[x]||'';
const GU=[[/pasta|alfredo|spaghetti|penne|lasagn|carbonara|gnocchi/i,'Pasta'],[/burger/i,'Burger'],[/ramen|noodle/i,'Ramen'],[/coffee|latte|brew|espresso|cappuccino/i,'Coffee'],[/cake|tiramisu|ice cream|brownie|dessert/i,'Dessert'],[/pizza/i,'Pizza'],[/biryani/i,'Biryani'],[/sushi|dumpling|momo|pho|dim sum/i,'Asian']],guess=n=>{for(const[r,c]of GU)if(r.test(n))return c;return n};
let S={prof:null,dishes:[],marks:[],defA:'Only me',defD:'Only me',draft:null},V={t:'home'},C=null,Q={q:'',f:'All'};
try{Object.assign(S,JSON.parse(localStorage.getItem('dishlog')||'{}'))}catch(_){}
const save=()=>{try{localStorage.setItem('dishlog',JSON.stringify(S));return true}catch(_){return false}};
const audOpts=()=>S.prof&&S.prof.priv==='Public'?['Only me','Friends or followers','Everyone']:['Only me','Accepted connections'];
const fmt=d=>new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short'}).toUpperCase(),rel=d=>{const n=Math.round((new Date(today())-new Date(d))/864e5);return n<=0?'today':n==1?'yesterday':n<14?n+' days ago':n<60?Math.round(n/7)+' weeks ago':fmt(d)};
const last=d=>d.v.reduce((m,v)=>v.d>m?v.d:m,''),nv=d=>[...d.v].sort((a,b)=>b.d.localeCompare(a.d)),allV=()=>S.dishes.flatMap(d=>d.v.map(v=>({d,v}))).sort((a,b)=>b.v.d.localeCompare(a.v.d)),pic=d=>{for(const v of nv(d))if(v.photos[0])return v.photos[0];return''};
const places=()=>{const m={};S.dishes.forEach(d=>{if(d.r){const k=d.r.toLowerCase();(m[k]=m[k]||{n:d.r,ds:[]}).ds.push(d)}});return Object.values(m).sort((a,b)=>b.ds.length-a.ds.length)};
const img=(s,c,a)=>s?`<img alt="${e(a)}" src="${s}">`:`<div class="ph" aria-hidden="true">${em(c)}</div>`;
const tile=(i,a,x,s,t,sub,c)=>`<button class="tile t${i%5}" data-a="${a}" data-x="${e(x)}">${img(s,c,t)}<span class="cap"><b>${e(t)}</b>${sub?`<small>${sub}</small>`:''}</span></button>`;
const row=d=>`<button class="item" data-a="dish" data-x="${d.id}">${img(pic(d),d.c,'')}<div><b>${e(d.n)}</b><div class="mut">${d.r?e(d.r)+' · ':''}${d.v.length}×${nv(d)[0].rx?' · '+rxl(nv(d)[0].rx):''}</div></div></button>`;
const note=(h,p,b,a,x)=>`<div class="empty"><h2>${h}</h2><p>${p}</p>${b?`<button class="pill pri" data-a="${a}" data-x="${x||''}">${b}</button>`:''}</div>`;
const back=(l,a,x)=>`<button class="link" data-a="${a}" data-x="${x||''}">← ${l}</button>`;
function toast(t){const o=$('#toast');o.textContent=t;o.hidden=false;clearTimeout(toast.i);toast.i=setTimeout(()=>o.hidden=true,3200)}
function go(t,x){V=Object.assign({t},x||{});render();window.scrollTo(0,0)}
const dirs=n=>`<a class="link" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(n)}" target="_blank" rel="noopener">Directions</a>`;
const V_={
home(){const h=new Date().getHours(),g=h<12?'morning':h<17?'afternoon':'evening',vs=allV();
 let o=`<div class="row"><h1>Good ${g},<br>${e(S.prof.name)}</h1><button class="av" data-a="tab" data-x="me" aria-label="Me">${e(S.prof.name[0].toUpperCase())}</button></div><p class="mut" style="margin:14px 0 0">What are you craving?</p><button class="srch" data-a="tab" data-x="explore">🔍 Search dishes, places or people</button><div class="chips">${['Pasta','Ramen','Coffee','Dessert','Pizza','Asian'].map(c=>`<button class="cat" data-a="cat" data-x="${c}"><b>${em(c)}</b>${c}</button>`).join('')}</div>`;
 if(!vs.length&&!S.marks.length)return o+note('Your Dishlog starts with one meal.','Log something you loved recently.','Add a memory','add');
 if(vs.length){const f=vs[0];o+=`<h2>Recent bites</h2><button class="hero" data-a="dish" data-x="${f.d.id}">${img(f.v.photos[0],f.d.c,f.d.n)}<div class="m"><h3>${e(f.d.n)}</h3><div class="mut">${e(f.d.r)}</div><span class="sticker">${rxl(f.v.rx)||'Logged'}</span> <span class="st">${rel(f.v.d)}</span></div></button>`;
  if(vs.length>1)o+=`<div class="rail" style="margin-top:16px">${vs.slice(1,8).map(x=>`<button class="mini" data-a="dish" data-x="${x.d.id}">${img(x.v.photos[0],x.d.c,x.d.n)}<b>${e(x.d.n)}</b><span class="st">${rel(x.v.d)}</span></button>`).join('')}</div>`}
 if(S.marks.length)o+=`<h2>Saved for later →</h2><p class="mut" style="margin-top:-6px">You’ve got ${S.marks.length} waiting.</p><div class="rail">${S.marks.map(m=>`<div class="want"><b>${e(m.n)}</b><div class="mut">${e(m.r)}${m.by?'<br>Recommended by '+e(m.by):''}</div><button class="pill red" data-a="tried" data-x="${m.id}">I tried this</button></div>`).join('')}</div>`;
 return o+`<h2>From people you trust</h2>`+note('Your table is quiet.','Find a few people whose food taste you trust.','Find people','tab','explore')},
explore(){return`<h1>Explore</h1><label for="q" class="mut" style="font-weight:400">Find a dish, place or person</label><input id="q" type="search" value="${e(Q.q)}"><div class="chips">${['All','Dishes','Places','People'].map(f=>`<button class="pill ${Q.f===f?'on':''}" data-a="sf" data-x="${f}">${f}</button>`).join('')}</div><div id="res"></div>`},
saved(){const ts=['Want to try','Lists'];let o=`<div class="row"><h1>Saved</h1><button class="pill pri" data-a="addm">+ Add</button></div><div class="chips">${ts.map(t=>`<button class="pill ${(V.tab||ts[0])===t?'on':''}" data-a="stab" data-x="${t}">${t}</button>`).join('')}</div>`;
 if(V.add)o+=`<div class="item" style="display:block"><label for="bn" style="margin-top:0">Dish or place</label><input id="bn"><label for="br">Restaurant</label><input id="br"><label for="bb">Recommended by</label><input id="bb"><button class="big dk" style="margin-top:12px" data-a="bm">Save for later</button></div>`;
 if((V.tab||ts[0])==='Lists'){const m={};S.dishes.forEach(d=>(m[d.c]=m[d.c]||[]).push(d));const k=Object.keys(m);return o+(k.map(c=>`<button class="item" data-a="colv" data-x="${e(c)}"><div class="ph" aria-hidden="true">${em(c)}</div><div><b>${e(c)}</b><div class="mut">${m[c].length} dishes</div></div></button>`).join('')||note('No lists yet.','Lists group your dishes automatically as you log them.'))}
 return o+(S.marks.map(m=>`<div class="item" style="display:block"><b>${e(m.n)}</b><div class="mut">${e(m.r)}${m.by?' · Recommended by <b>'+e(m.by)+'</b>':''}</div><div class="row" style="justify-content:flex-start;margin-top:8px">${m.r?dirs(m.r):''}<button class="pill red" style="padding:6px 14px" data-a="tried" data-x="${m.id}">I tried this</button><button class="link" data-a="rm" data-x="${m.id}">Remove</button></div></div>`).join('')||note('Nothing waiting yet.','When someone recommends something good, save it here so you don’t forget.','Explore','tab','explore'))},
me(){const ds=S.dishes,ob=ds.filter(d=>d.v.some(v=>v.rx==='Obsessed')).length;return`<div class="row" style="justify-content:flex-start;gap:14px"><div class="av" style="width:72px;height:72px;font-size:30px;display:grid;place-items:center">${e(S.prof.name[0].toUpperCase())}</div><div><h1>${e(S.prof.name)}</h1><div class="mut">${e(S.prof.bio||'')}</div></div></div><div class="row" style="margin:20px 0;text-align:center">${[[ds.length,'dishes'],[places().length,'places'],[ob,'obsessed']].map(([n,l])=>`<div style="flex:1"><h1>${n}</h1><span class="mut">${l}</span></div>`).join('')}</div>${[['dl','My Dishlog'],['fr','Friends / Following'],['ac','Activity'],['set','Settings']].map(([a,l])=>`<button class="item" data-a="tab" data-x="${a}"><b style="flex:1">${l}</b>›</button>`).join('')}`},
dl(){const f=V.f||'All',q=(V.q||'').toLowerCase(),has=d=>!q||[d.n,d.c,d.r,...d.v.map(v=>v.cap),...d.v.map(v=>v.p)].join(' ').toLowerCase().includes(q),ds=S.dishes.filter(has).sort((a,b)=>last(b).localeCompare(last(a)));let g='';
 if(f==='All'||f==='Obsessed')g=allV().filter(o=>has(o.d)&&(f==='All'||o.v.rx==='Obsessed')).map((o,i)=>tile(i,'dish',o.d.id,o.v.photos[0],o.d.n,(o.d.r?e(o.d.r)+' · ':'')+fmt(o.v.d),o.d.c)).join('');
 else if(f==='Dishes'||f==='col')g=ds.filter(d=>f==='Dishes'||d.c===V.n).map((d,i)=>tile(i,'dish',d.id,pic(d),d.n,d.v.length>1?d.v.length+' visits':e(d.r),d.c)).join('');
 else if(f==='Places')g=places().filter(p=>p.ds.some(has)).map((p,i)=>tile(i,'place',p.n,pic(p.ds[0]),p.n,p.ds.length+' dishes',p.ds[0].c)).join('');
 else{const m={};ds.forEach(d=>(m[d.c]=m[d.c]||[]).push(d));g=Object.entries(m).map(([c,x],i)=>tile(i,'colv',c,pic(x[0]),c,x.length+' dishes',c)).join('')}
 return`<h1>My Dishlog</h1><label class="mut" for="mq" style="font-weight:400">Search my Dishlog</label><input id="mq" type="search" value="${e(V.q)}"><div class="chips">${['All','Obsessed','Dishes','Places','Collections'].map(x=>`<button class="pill ${(f==='col'?'Collections':f)===x?'on':''}" data-a="df" data-x="${x}">${x==='Obsessed'?'😍 ':''}${x}</button>`).join('')}</div>${f==='col'?`<h2 style="margin-top:0">${em(V.n)} ${e(V.n)}</h2>`:''}<div class="mosaic" id="mos">${g||''}</div>${g?'':note('Your food memory starts here.','That pasta you still think about? Start with that.','Add your first memory','add')}`},
dish(){const d=S.dishes.find(x=>x.id===V.id);if(!d)return V_.dl();const vs=nv(d),l=vs[0],n=d.v.length;
 return`${back('My Dishlog','tab','dl')}<div style="margin:10px -18px 0">${img(pic(d),d.c,d.n)}</div><style>#app>div:nth-child(2) img,#app>div:nth-child(2) .ph{width:100%;aspect-ratio:1;object-fit:cover;display:grid}</style><h1 style="margin-top:14px">${e(d.n)}</h1>${l.rx?`<span class="sticker" style="margin-top:8px">${rxl(l.rx)}</span>`:''}${d.r?`<p><button class="link" style="font-size:16px" data-a="place" data-x="${e(d.r)}">${e(d.r)}</button></p>`:''}<p class="mut">You’ve had this ${n} time${n>1?'s':''} · in ${e(d.c)}</p><h2>Your history</h2><div class="line">${vs.map(v=>`<div class="stop"><span class="st">${fmt(v.d)} ${v.d.slice(0,4)}</span>${v.photos.length?`<div class="car">${v.photos.map((p,i)=>`<img alt="${e(d.n)} photo ${i+1}" src="${p}">`).join('')}</div>`:''}${v.cap?`<p class="quote">“${e(v.cap)}”</p>`:''}${v.rx?`<span class="tag">${rxl(v.rx)}</span>`:''}${v.p?`<span class="tag">With ${e(v.p)}</span>`:''}${v.by?`<span class="tag">Recommended by ${e(v.by)}</span>`:''}<div class="mut">Visible to: ${v.ra} · Date: ${v.da} <button class="link" data-a="dv" data-x="${v.id}">Delete</button></div></div>`).join('')}</div><button class="link" data-a="dd" data-x="${d.id}">Delete dish and history</button><div class="sticky"><button class="big" data-a="again" data-x="${d.id}">+ Had it again</button></div>`},
place(){const p=V.p,ds=S.dishes.filter(d=>d.r.toLowerCase()===p.toLowerCase()),mk=S.marks.filter(m=>m.r.toLowerCase()===p.toLowerCase());
 return`${back('Back','tab','dl')}<h1 style="margin-top:8px">${e(p)}</h1><p>${dirs(p)}</p><h2>You’ve had here</h2>${ds.map(row).join('')||'<p class="mut">Nothing logged here yet.</p>'}<h2>Your visits</h2>${ds.flatMap(d=>d.v.map(v=>({d,v}))).sort((a,b)=>b.v.d.localeCompare(a.v.d)).map(o=>`<p><span class="st">${fmt(o.v.d)}</span> ${e(o.d.n)} ${o.v.rx?rxl(o.v.rx):''}</p>`).join('')}<h2>Saved here</h2>${mk.map(m=>`<div class="item" style="display:block"><b>${e(m.n)}</b> <button class="pill red" style="padding:4px 12px;font-size:13px" data-a="tried" data-x="${m.id}">I tried this</button></div>`).join('')||'<p class="mut">Nothing saved here.</p>'}<h2>From friends</h2><p class="mut">Friends’ recommendations appear once accounts are connected.</p>`},
fr(){return back('Me','tab','me')+note('Your table is quiet.','Finding and following people needs accounts, which this version doesn’t have yet.')},
ac(){return back('Me','tab','me')+note('Nothing yet.','Requests, likes and tags will show here once social accounts are connected.')},
set(){return`${back('Me','tab','me')}<h2 style="margin-top:8px">Settings</h2><label for="sn">Name</label><input id="sn" value="${e(S.prof.name)}"><label for="sb">Bio</label><input id="sb" value="${e(S.prof.bio||'')}"><label for="sv">Profile privacy</label><select id="sv"><option ${S.prof.priv==='Private'?'selected':''}>Private</option><option ${S.prof.priv==='Public'?'selected':''}>Public</option></select><label for="sa">Default memory audience</label><select id="sa">${audOpts().map(o=>`<option ${S.defA===o?'selected':''}>${o}</option>`)}</select><label for="sd">Default visit-date audience</label><select id="sd">${audOpts().map(o=>`<option ${S.defD===o?'selected':''}>${o}</option>`)}</select><button class="big" style="margin-top:18px" data-a="ss">Save settings</button><button class="pill" style="margin-top:12px;width:100%" data-a="ex">Export my memories</button><button class="pill" style="margin-top:10px;width:100%" data-a="del">Delete account and all data</button>`}};
function render(){
 if(!S.prof){$('#nav').innerHTML='';return $('#app').innerHTML=`<div class="ph" style="height:240px;margin:0 -18px 20px;font-size:72px;gap:10px;grid-auto-flow:column;place-content:center" aria-hidden="true">🍝 🍜 ☕ 🍰</div><h1>Remember the food worth remembering.</h1><p class="mut">Where you had it, what you loved, and who you shared it with.</p><label for="pn">Your name</label><input id="pn" autocomplete="given-name"><label>How do you want to use Dishlog?</label><div class="chips" style="flex-wrap:wrap;margin:6px 0">${['Remember what I eat','Find recommendations','Keep places to try','See what friends love'].map(x=>`<button class="pill" aria-pressed="false" data-a="intent">${x}</button>`).join('')}</div><p class="mut">Your profile starts private. You can change that in Settings.</p><button class="big" style="margin-top:14px" data-a="onb">Get started</button>`}
 const t=V.t,own=['dl','dish','place','fr','ac','set'].includes(t)?'me':t;
 $('#nav').innerHTML=[['home','🏠','Home'],['explore','🔍','Explore']].map(([k,i,l])=>`<button data-a="tab" data-x="${k}" class="${own===k?'on':''}"><b>${i}</b>${l}</button>`).join('')+`<button class="plus" data-a="add" aria-label="Add memory">+</button>`+[['saved','🔖','Saved'],['me','👤','Me']].map(([k,i,l])=>`<button data-a="tab" data-x="${k}" class="${own===k?'on':''}"><b>${i}</b>${l}</button>`).join('');
 $('#app').innerHTML=(V_[t]||V_.home)();if(t==='explore')res()}
function res(){const r=$('#res'),q=Q.q.toLowerCase(),f=Q.f,has=(...a)=>a.some(x=>(x||'').toLowerCase().includes(q));let o='';
 if(!q){const p=places().slice(0,5);return r.innerHTML=(p.length?`<h2>Places you keep returning to</h2>${p.map(x=>`<button class="item" data-a="place" data-x="${e(x.n)}"><div class="ph" aria-hidden="true">📍</div><div><b>${e(x.n)}</b><div class="mut">${x.ds.length} dishes</div></div></button>`).join('')}`:'')+`<h2>Friends are loving</h2><p class="mut">Trusted recommendations from people you follow will appear here once accounts are connected.</p>`}
 if(f==='All'||f==='Dishes')o+=S.dishes.filter(d=>has(d.n,d.c,d.r,...d.v.map(v=>v.cap),...d.v.map(v=>v.p))).map(row).join('');
 if(f==='All'||f==='Places')o+=places().filter(p=>has(p.n)).map(x=>`<button class="item" data-a="place" data-x="${e(x.n)}"><div class="ph" aria-hidden="true">📍</div><div><b>${e(x.n)}</b><div class="mut">${x.ds.length} dishes</div></div></button>`).join('');
 if(f==='People')o='<p class="mut">People search needs accounts, which this version doesn’t have yet.</p>';
 r.innerHTML=o||'<p class="mut">No results. Try a dish or restaurant name.</p>'}
function rs(f){return new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,640/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.7))};i.onerror=()=>r(null);i.src=u})}
function sheet(pre){pre=pre||S.draft||{};C={photos:pre.photos?[...pre.photos]:[],mark:pre.mark||null,by:pre.by||'',id:uid(),join:pre.join||null};const ao=audOpts(),sel=(v,d)=>ao.map(o=>`<option ${(ao.includes(v)?v:d)===o?'selected':''}>${o}</option>`).join('');
 $('#sheet').innerHTML=`<div><div class="row"><button class="pill" data-a="close">Close</button><span class="mut">${S.draft&&!pre.mark&&!pre.join?'Draft restored':''}</span></div><div id="dr" hidden class="ban">Unsaved changes.<br><button class="pill" data-a="keep">Keep draft</button><button class="pill" data-a="disc">Discard</button></div><h1 style="margin:14px 0">What did you eat?</h1>
 <div class="pb"><label>📷 Take photo<input class="vh" id="p1" type="file" accept="image/*" capture="environment"></label><label>🖼 Choose photos<input class="vh" id="p2" type="file" accept="image/*" multiple></label></div><div class="thumbs" id="th"></div>
 <label for="n">Dish name</label><input id="n" list="dn" value="${e(pre.n)}" autocomplete="off"><datalist id="dn">${[...new Set(S.dishes.map(d=>d.n))].map(n=>`<option value="${e(n)}">`).join('')}</datalist>
 <label for="r">Where did you have it? <span class="mut" style="font-weight:400">(optional)</span></label><input id="r" list="rn" value="${e(pre.r)}"><datalist id="rn">${places().map(p=>`<option value="${e(p.n)}">`).join('')}</datalist><div id="bn"></div>
 <label>How was it?</label><div class="rxs" role="radiogroup">${[['Obsessed','😍','Obsessed'],['It’s good','🙂','Good'],['Skip next time','😐','Skip next time']].map(([v,i,l])=>`<label><input type="radio" name="rx" value="${v}" ${pre.rx===v?'checked':''}><span>${i}</span>${l}</label>`).join('')}</div>
 <p class="mut" style="margin:14px 0 0">Visible to: <select id="ra" style="width:auto;padding:4px 8px">${sel(pre.ra,S.defA)}</select></p>
 <button class="link" data-a="det" style="margin-top:8px">+ Add details</button><div id="det" hidden><label for="cap">Note</label><textarea id="cap" rows="2">${e(pre.cap)}</textarea><label for="p">Who were you with?</label><input id="p" value="${e(pre.p)}"><label for="d">Visit date</label><input id="d" type="date" value="${pre.d||today()}"><label for="c">Collection</label><input id="c" list="cn" value="${e(pre.c)}" placeholder="Auto-suggested"><datalist id="cn">${[...new Set([...Object.keys(EM),...S.dishes.map(d=>d.c)])].map(n=>`<option value="${e(n)}">`).join('')}</datalist><label for="da">Who can see the visit date</label><select id="da">${sel(pre.da,S.defD)}</select><p class="mut">Tagging someone never widens who can see a memory.</p></div>
 <div class="err" id="er" role="alert"></div><div class="save"><button class="big" id="sb" data-a="sv">Save memory</button></div></div>`;
 $('#sheet').hidden=false;ph();chk();const add=async ev=>{for(const f of ev.target.files){if(C.photos.length>=8)break;const d=await rs(f);if(d)C.photos.push(d)}ev.target.value='';ph()};$('#p1').onchange=add;$('#p2').onchange=add}
function ph(){$('#th').innerHTML=C.photos.map((p,i)=>`<div><img alt="Photo ${i+1}" src="${p}"><button class="link" data-a="cv" data-x="${i}">${i?'Make cover':'Cover'}</button><button class="link" data-a="rp" data-x="${i}">Remove</button></div>`).join('')}
function chk(){const n=$('#n').value.trim().toLowerCase(),r=$('#r').value.trim().toLowerCase(),b=$('#bn');if(!n||C.sep){b.innerHTML='';C.join=null;return}
 const ms=S.dishes.filter(d=>d.n.toLowerCase()===n),ex=ms.find(d=>d.r.toLowerCase()===r)||(!r&&ms[0]);if(ex&&C.join!==ex.id&&!C.joinAuto){C.join=ex.id}
 if(!ms.length){b.innerHTML='';C.join=null;return}const m=ex||ms[0];b.innerHTML=`<div class="ban"><b>You’ve had this before 👀</b><br>${e(m.n)}${m.r?' · '+e(m.r):''} · Last had ${fmt(last(m))}<br>${ex?'<span class="mut">This will be added as another visit.</span>':'<button class="pill" data-a="join" data-x="'+m.id+'">Add another visit</button>'}<button class="pill" data-a="sep">This is somewhere else</button></div>`}
const form=()=>({n:$('#n').value.trim(),c:$('#c').value.trim(),r:$('#r').value.trim(),cap:$('#cap').value.trim(),p:$('#p').value.trim(),d:$('#d').value,ra:$('#ra').value,da:$('#da').value,rx:(document.querySelector('input[name=rx]:checked')||{}).value||'',photos:C.photos,mark:C.mark,by:C.by}),dirty=()=>{const f=form();return f.n||f.r||f.cap||f.p||f.photos.length||f.rx};
function sv(){if(C.busy)return;const f=form(),er=$('#er');if(!f.n){er.textContent='Enter a dish name to save.';$('#n').focus();return}
 C.busy=1;$('#sb').disabled=true;const bk=JSON.stringify(S),k=s=>s.toLowerCase(),v={id:C.id,photos:f.photos,cap:f.cap,rx:f.rx,p:f.p,d:f.d||today(),ra:f.ra,da:f.da,by:C.by};
 let d=S.dishes.find(x=>x.id===C.join&&!C.sep),rep=!!d;if(!d)d=!C.sep&&S.dishes.find(x=>k(x.n)===k(f.n)&&k(x.r)===k(f.r));if(d)rep=true;else{d={id:uid(),n:f.n,c:f.c||guess(f.n),r:f.r,v:[]};S.dishes.push(d)}
 if(!d.v.some(x=>x.id===v.id))d.v.push(v);S.draft=null;if(C.mark)S.marks=S.marks.filter(m=>m.id!==C.mark);
 if(!save()){S=JSON.parse(bk);C.busy=0;$('#sb').disabled=false;er.textContent='Not saved: storage is full. Remove a photo and try again. Your entries are kept.';return}
 navigator.vibrate&&navigator.vibrate(15);$('#sheet').hidden=true;go('dish',{id:d.id});toast(C.mark?'Tried it ✓ Added to your Dishlog':rep?'Another one for the memory lane':'Saved to your Dishlog ✓')}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,x=b.dataset.x;
 const F={tab:()=>go(x),add:()=>sheet(),addm:()=>{V.add=!V.add;render()},stab:()=>{V.tab=x;render()},cat:()=>{Q={q:x,f:'All'};go('explore')},sf:()=>{Q.f=x;render()},df:()=>{V.f=x;render()},colv:()=>go('dl',{f:'col',n:x}),dish:()=>go('dish',{id:x}),place:()=>go('place',{p:x}),
 intent:()=>{const o=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',o);b.classList.toggle('on',o)},
 onb:()=>{const n=$('#pn').value.trim();if(!n)return $('#pn').focus();S.prof={name:n,priv:'Private',intents:[...document.querySelectorAll('[data-a=intent].on')].map(i=>i.textContent)};save();go('home')},
 close:()=>dirty()?$('#dr').hidden=false:$('#sheet').hidden=true,keep:()=>{S.draft=form();save();$('#sheet').hidden=true;toast('Draft kept')},disc:()=>{S.draft=null;save();$('#sheet').hidden=true},det:()=>{$('#det').hidden=!$('#det').hidden},
 join:()=>{C.join=x;C.sep=false;toast('Will be added as another visit')},sep:()=>{C.sep=true;C.join=null;chk()},cv:()=>{C.photos.unshift(C.photos.splice(+x,1)[0]);ph()},rp:()=>{C.photos.splice(+x,1);ph()},sv,
 again:()=>{const d=S.dishes.find(i=>i.id===x);sheet({n:d.n,c:d.c,r:d.r,join:d.id})},
 dv:()=>{if(!confirm('Delete this visit? Other visits are kept.'))return;const d=S.dishes.find(i=>i.id===V.id);d.v=d.v.filter(v=>v.id!==x);if(!d.v.length)S.dishes=S.dishes.filter(i=>i!==d);save();d.v.length?render():go('dl')},
 dd:()=>{if(confirm('Delete this dish and all its visits?')){S.dishes=S.dishes.filter(i=>i.id!==x);save();go('dl')}},
 bm:()=>{const n=$('#bn').value.trim();if(!n)return $('#bn').focus();S.marks.push({id:uid(),n,r:$('#br').value.trim(),by:$('#bb').value.trim()});save();V.add=false;render();toast('Saved for later')},
 rm:()=>{S.marks=S.marks.filter(m=>m.id!==x);save();render()},tried:()=>{const m=S.marks.find(i=>i.id===x);sheet({n:m.n,r:m.r,mark:m.id,by:m.by})},
 ss:()=>{S.prof=Object.assign(S.prof,{name:$('#sn').value.trim()||S.prof.name,bio:$('#sb').value.trim(),priv:$('#sv').value});const o=audOpts();S.defA=o.includes($('#sa').value)?$('#sa').value:'Only me';S.defD=o.includes($('#sd').value)?$('#sd').value:'Only me';save();toast('Settings saved');render()},
 ex:()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({dishes:S.dishes,bookmarks:S.marks},null,1)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='dishlog-export.json';l.click()},
 del:()=>{if(confirm('Delete your profile, memories, photos and bookmarks? This cannot be undone.')){try{localStorage.removeItem('dishlog')}catch(_){}S={prof:null,dishes:[],marks:[],defA:'Only me',defD:'Only me',draft:null};V={t:'home'};render()}}};
 if(F[a])F[a]()});
document.addEventListener('input',ev=>{const i=ev.target.id;if(i==='q'){Q.q=ev.target.value;res()}else if(i==='mq'){V.q=ev.target.value;const p=ev.target.selectionStart;render();const m=$('#mq');m.focus();m.setSelectionRange(p,p)}else if(i==='n'||i==='r')chk()});
render();
</script></body></html>
