<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBSUevu8aqt7YzeHKTeKXuxjQIf7rOmttw",
  authDomain: "masters-compass.firebaseapp.com",
  projectId: "masters-compass",
  storageBucket: "masters-compass.firebasestorage.app",
  messagingSenderId: "645350599789",
  appId: "1:645350599789:web:9d0514c4866bbe92e8a364",
  measurementId: "G-W8J70N0MRY"
};

const firebaseApp = initializeApp(firebaseConfig);
const firebaseAuth = getAuth(firebaseApp);
const googleProvider = new GoogleAuthProvider();
googleProvider.setCustomParameters({ prompt: "select_account" });

window.mcFirebaseSignIn = async () => {
  try {
    await signInWithPopup(firebaseAuth, googleProvider);
  } catch (error) {
    window.dispatchEvent(new CustomEvent("mc-auth-error", { detail: error?.message || "Google sign-in failed." }));
  }
};

window.mcFirebaseSignOut = async () => {
  try {
    await signOut(firebaseAuth);
  } catch (error) {
    window.dispatchEvent(new CustomEvent("mc-auth-error", { detail: error?.message || "Sign-out failed." }));
  }
};

onAuthStateChanged(firebaseAuth, user => {
  window.dispatchEvent(new CustomEvent("mc-auth-state", {
    detail: user ? {
      uid: user.uid,
      name: user.displayName || (user.email ? user.email.split("@")[0] : "Applicant"),
      email: user.email || "",
      photoURL: user.photoURL || ""
    } : null
  }));
});
</script>

if(a==='vfs2'){const p=P(t.dataset.id);p.vf=p.vf||{};const v=p.vf[t.dataset.k]=p.vf[t.dataset.k]||{v:''},ok=t.value==='Verified';v.st=t.value;v.date=ok?today():'';v.iso=ok?new Date().toISOString().slice(0,10):'';save();render()}
else if(a==='qtk'){P(t.dataset.id).qs[+t.dataset.i].d=t.checked;save();render()}});

let dragV=null;

else if(a==='vdn'&&i<L.length-1){[L[i+1],L[i]]=[L[i],L[i+1]];save();render()}});

S.prefs=S.prefs||{};if(!S.prefs.chosen){S.prefs.theme='midnight';S.prefs.mode='dark'}S.prefs.mode=S.prefs.mode||'dark';if(!THEMES.some(x=>x[0]===S.prefs.theme))S.prefs.theme='midnight';document.documentElement.dataset.theme=S.prefs.theme;document.documentElement.dataset.mode=S.prefs.mode;document.addEventListener('click',e=>{const t=e.target.closest('[data-a="mode"]');if(!t)return;const h=document.documentElement;h.classList.add('tt');h.dataset.mode=t.dataset.v;(S.prefs=S.prefs||{}).mode=t.dataset.v;S.prefs.chosen=1;save();render();setTimeout(()=>h.classList.remove('tt'),320)});
